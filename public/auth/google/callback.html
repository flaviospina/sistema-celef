<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>Retornando do Google…</title>
<!--
  Página ESTÁTICA de retorno do login Google (é o redirect_uri registrado no Google Cloud).

  O sistema pede ao Google response_mode=fragment: os parâmetros voltam DEPOIS do "#"
  (callback.html#code=…&state=…&iss=https://accounts.google.com). O navegador nunca envia o fragmento ao servidor, então:
    1) o ModSecurity da hospedagem, que recusa (406) qualquer parâmetro cujo valor seja uma URL (caso do "iss"),
       não tem o que inspecionar;
    2) o código de autorização não fica em logs de acesso do servidor nesta etapa.
  O script abaixo encaminha SOMENTE code, state e error para /auth/google/callback (PHP), que faz toda a validação.
  Como essa segunda navegação parte do próprio site, o cookie de sessão SameSite=Strict é enviado normalmente.
-->
<style>body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#163a5a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:1rem}p{opacity:.9}a{color:#fff}</style>
</head>
<body>
<p id="msg">Concluindo o login…</p>
<noscript><p>Este sistema precisa de JavaScript habilitado para concluir o login. Ative o JavaScript e tente novamente.</p></noscript>
<script>
(function () {
  'use strict';
  // fragmento (modo padrão do sistema) ou, por compatibilidade, query string
  var bruto = window.location.hash.length > 1 ? window.location.hash.substring(1) : window.location.search.substring(1);
  var entrada = new URLSearchParams(bruto);
  var saida = new URLSearchParams();
  ['code', 'state', 'error'].forEach(function (k) { if (entrada.has(k)) { saida.set(k, entrada.get(k)); } });
  if (!saida.has('state')) {
    document.getElementById('msg').innerHTML = 'Retorno do Google incompleto. <a href="../../login">Volte ao sistema</a> e tente entrar novamente.';
    return;
  }
  // "callback" relativo a /…/auth/google/callback.html → /…/auth/google/callback (rota PHP). replace() tira esta
  // página (e o fragmento com o código) do histórico do navegador.
  window.location.replace('callback?' + saida.toString());
})();
</script>
</body>
</html>
